<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Developer Site</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .facebook-btn {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 20px;
            background-color: #1877F2; /* Official Facebook blue */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .facebook-btn:hover {
            background-color: #166FE5;
        }
        .test-link {
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>App Developer Portfolio</h1>
        <p>Welcome to the official page for Andygrams and Andygrams Daily Challenge.</p>
        <p><em>Website is currently under construction.</em></p>
        
        <!-- Added Facebook Link -->
        <a href="https://www.facebook.com/profile.php?id=61586759099743" target="_blank" class="facebook-btn">Follow on Facebook</a>
        
        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">
        
        <!-- Helpful link for you to quickly test if your txt file is live -->
        <p class="test-link"><a href="/app-ads.txt">Verify app-ads.txt</a></p>
    </div>
</body>
</html>
